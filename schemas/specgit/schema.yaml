# SpecGit schema guidance (schema-facing documentation).
#
# This file documents the three normative schemas SpecGit validates:
#   1. the delivery binding record  — `.specgit.yaml` at the repository root
#   2. the project policy           — `spec_git/policy.yaml`
#   3. the platform declaration     — `spec_git/providers.yaml`
# It is guidance for humans and agents; the validating implementation is the
# specgit CLI (src/record/{schema,policy,providers}.ts). Templates for the
# record and the policy live in ./templates/.
#
# There are intentionally no artifact schemas (proposal/spec/design/tasks):
# acceptance derives from git, issues, the PR, and checks — never from
# authored artifacts.

name: specgit
version: 1
description: >-
  Delivery binding schemas. One delivery = execution context (branch or
  worktree) + forge issues[] (GitHub or a declared GitLab) + one PR + required
  checks. States are derived per invocation and never persisted; evaluation
  fails closed.

documents:

  record:
    filename: ".specgit.yaml"
    location: repository root (git rev-parse --show-toplevel)
    committed: on the delivery branch
    schema:
      version:
        type: literal 1
        required: true
      delivery:
        type: string
        required: true
        pattern: kebab-case (lowercase alphanumerics, single-hyphen separators)
        notes: Set once at first bind; rejected on later binds.
      context:
        type: discriminated union on "kind"
        required: true
        variants:
          - kind: branch
            fields:
              branch: { type: string, required: true, notes: must equal the live branch at evaluation }
          - kind: worktree
            fields:
              label: { type: string, required: true, notes: portable label, never a local path }
              branch: { type: string, required: true }
        notes: >-
          Written by `specgit bind` from live git. No CLI flag can set the
          context; unknown kinds are invalid. Worktree labels resolve through
          `git worktree list` to the record branch.
      issues:
        type: array of positive integers
        default: []
        notes: >-
          Forge issue numbers (GitHub only before a platform declaration —
          opaque tracker ids are rejected at bind: issue_ref_not_github).
          Record cardinality 0..N; acceptance requires >= 1 (issues_empty).
          Values merge-dedupe across binds, first-seen order kept.
      issueKinds:
        type: >-
          array of objects, each with an `issue` (positive integer) and a
          `kind` (non-empty string)
        required: false
        notes: >-
          Written by `specgit issue` (#338): each bound issue's own inferred
          `kind::<type>` slug, so the tag step never lets one issue inherit
          another title's kind. Reused or unparsable-title issues carry no
          entry. Absent on records written before the field existed (legacy
          tagging applies); preserved on rewrite.
      pr:
        type: positive integer or non-empty string (URL verbatim)
        optional: true
        notes: >-
          At most one PR per delivery; a new --pr replaces the old. Record
          cardinality 0..1; acceptance requires exactly one (pr_missing).
    unknown_keys: parsed-but-ignored and preserved on rewrite

  policy:
    filename: "policy.yaml"
    location: spec_git/ under the repository root (the directory marks the project)
    committed: yes, typically on the default branch
    schema:
      version:
        type: literal 1
        required: true
      required_checks:
        type: array of non-empty strings
        required: true
        notes: >-
          Exact check-run names matched byte-for-byte against check runs
          reported at the PR head commit. Declared locally, never read from
          GitHub rulesets. An empty list is the no-CI policy: the
          repository names zero sibling checks, the acceptance workflow's
          wait step trivially completes, and the SpecGit Acceptance job
          itself (kept out of this list to avoid wait-step self-deadlock,
          enforced through branch protection) is the gate. Init's no-CI
          detection fallback writes exactly this list — a fallback NAME
          the harness cannot produce as a check-run would make the
          verdict unsatisfiable.
      ordered_issues:
        type: boolean
        required: false
        default: false
        notes: >-
          Turns on the sequence gate (G8): with ordered_issues true, no
          OPEN issue with a smaller number than the delivery's smallest
          bound issue may exist — deliver or close the earlier issue
          first (issue_out_of_order). Off (default) passes the gate
          vacuously.
      language:
        type: enum en | zh
        required: false
        default: en
        notes: >-
          Presentation language of generated text (#118): the issue/PR
          scaffolds, the managed guidance block, and success-path stderr
          prose. The machine contract — exit codes, `--json` field names,
          diagnostic codes, closing references (`Closes #n`) — is never
          localized under any value. Adding a language is a catalog
          addition in src/i18n/language.ts, not a policy-format change.
      tags:
        type: array of strict objects (name, optional color, optional description)
        required: false
        default: []
        notes: >-
          Project-declared tag vocabulary (#330): the pool-first selection's
          additional seedable names beyond the built-in `kind::` catalog.
          `name` must satisfy the portable tag grammar
          (^[a-z0-9]+(-[a-z0-9]+)*(::[a-z0-9]+(-[a-z0-9]+)*)?$, <= 64 chars —
          safe on both forges); `color` is six hex digits without "#" and
          falls back to the catalog's stable per-name assignment when
          absent; `description` is at most 300 chars. Declared names are
          seedable; anything else absent from the repository pool is an
          unknown slug the selection refuses (issue_tags_unknown).
    unknown_keys: invalid (strict schema)

  providers:
    filename: "providers.yaml"
    location: spec_git/ under the repository root
    committed: yes — the team shares one declaration
    schema:
      gitlab:
        type: object (optional at the top level; present when the origin's
          platform is declared GitLab)
        fields:
          host:
            type: non-empty bare hostname (letters, digits, dots, hyphens —
              no scheme, no path)
            required: true
          port:
            type: integer 1..65535 (or its decimal string form)
            required: false
            notes: >-
              Present only when the instance uses a non-default port (#78):
              a scheme-default port (:443 https, :22 ssh) classifies like
              the portless form, and any other port classifies only when
              the declaration names it.
          insecure_ssl:
            type: boolean
            required: false
            default: false
            notes: written by init; reserved for the glab roadmap.
    unknown_keys: invalid (strict schema)
    notes: >-
      The declaration the URL heuristics cannot make: which self-hosted
      host is a GitLab instance. Classification (origin grammar, depth 2-5
      group paths, #112), the evaluator's provider routing (#117 — declared
      GitLab origins evaluate every gate through glab), doctor, and status
      all read it; an undeclared `*gitlab*` host stays unresolvable
      (gitlab_unsupported). Written by `specgit init --gitlab-host` or the
      gitlab.com heuristic; the file's bytes that cannot be read make init
      and status refuse heuristic classification
      (platform_providers_invalid) instead of guessing.

acceptance:
  gates:
    - g1_record        # record_missing, record_invalid
    - g2_policy        # policy_missing, policy_invalid
    - g3_completeness  # issues_empty, pr_missing
    - g4_context       # not_a_git_repo, git_unavailable, no_commits, detached_head, branch_mismatch, merged_delivery_not_contained, merged_lineage_unavailable, worktree_mismatch
    - g5_origin        # no_origin, origin_unresolvable, gitlab_unsupported
    - g6_provider      # gh_missing, gh_unauthenticated, gh_transport on the GitHub route; glab_missing, glab_unauthenticated, glab_transport on a declared GitLab origin
    - g7_issues        # issue_not_found, issue_is_pull_request
    - g8_sequence      # issue_out_of_order (only when policy.ordered_issues is true)
    - g9_pr            # pr_not_found, pr_closed_unmerged, pr_draft, pr_head_mismatch, pr_repo_mismatch
    - g10_closing_refs # closing_refs_incomplete
    - g11_checks       # checks_missing, checks_pending, checks_failed (per check name)
  semantics: >-
    Gates short-circuit across gates and collect all failures within a gate.
    All evidence gathered and >= 1 gate failed => rejected (exit 1). Evidence
    unavailable => unknown (exit 3). Every gate passed => accepted (exit 0).
    Checks evaluate at the PR head SHA; local head staleness is a warning
    (local_head_stale) only; a dirty tree is evidence, never a gate.

state_assets:
  taxonomy: >-
    Everything specgit writes falls into exactly three tiers (normative
    table: docs/reference.md#state-and-assets). Authoritative committed
    files carry the product state and are human-edited; derived committed
    harness is generated by `specgit init` and regenerated (`init --force`)
    rather than hand-edited; local integration assets are per-tool entry
    points written by `specgit setup` and never feed acceptance.
  tiers:
    authoritative_committed:
      paths: [spec_git/policy.yaml, .specgit.yaml, spec_git/providers.yaml]
      written_by: "specgit init (policy, providers), specgit issue / bind (record)"
      rule: source of truth; hand-editable, reviewed in PRs like code
    derived_committed_harness:
      paths:
        - .github/workflows/specgit-accept.yml
        - AGENTS.md (specgit managed block)
        - CLAUDE.md (specgit managed block, when present)
        - .opencode/hooks.json (specgit guard entry)
        - .opencode/hooks/specgit-merge-guard.sh
        - git pre-push hook (specgit managed markers)
      written_by: specgit init
      rule: regenerate (init --force) instead of hand-editing
    local_integration_assets:
      paths:
        - .opencode/command/specgit-issue.md
        - .opencode/command/specgit-finish.md
        - .opencode/command/specgit-doctor.md
        - .opencode/command/specgit-pr.md
        - .opencode/command/specgit-status.md
        - .agents/skills/specgit-issue/SKILL.md
        - .agents/skills/specgit-finish/SKILL.md
        - .agents/skills/specgit-doctor/SKILL.md
        - .agents/skills/specgit-pr/SKILL.md
        - .agents/skills/specgit-status/SKILL.md
      written_by: specgit setup
      rule: agent conveniences only; never acceptance inputs
  drift_report: >-
    #308: `specgit status` reports, under `assets.generated`, whether each
    managed asset of the last two tiers is current, stale (asset_stale),
    missing (asset_missing), or conflict (asset_conflict — ownership
    unproven, a human decision), grouped by the surface that repairs it
    (init → `specgit init --force` / `specgit init` when no policy exists;
    opencode → `specgit setup --tool opencode`; generic → `specgit setup
    --tool generic`). One shared read-only inspector over the writers' own
    desired states; an uninstalled optional setup surface is `absent`
    (clean, no missing-file list). The verdict is fail-closed about its
    own coverage: clean requires complete — every desired part claimed or
    proven skipped; uninspected codes name the unknown parts that make a
    report incomplete (workflow_platform_undecided,
    workflow_platform_providers_invalid, workflow_default_branch_unresolved,
    hooks_json_unmerged, ignore_tracked_unknown, ignore_unreadable), while
    skipped names the intentional, proven
    opt-out (ignore_committed_authoritative — the committed-authoritative
    model) that never spoils an otherwise current report. Drift never
    changes the exit code and fail-closed snapshots carry no drift claim.

command_surface:
  commands:
    - init      # policy + harness (writes the authoritative policy and the derived harness)
    - setup     # agent entry points (writes the local integration assets)
    - issue     # one-command delivery bootstrap
    - finish    # the acceptance verdict (the CI gate runs this)
    - pr        # repair the PR binding (auto-discover by head branch)
    - status    # local evidence only
    - doctor    # probe prerequisites
    - bind      # script alias
    - unbind    # script alias
    - accept    # script/CI alias (same evaluator as finish)
  notes: >-
    Ten public commands; bind/unbind/accept are machine aliases. Exit codes
    0/1/2/3 (130 = SIGINT interruption, the single exception outside the
    JSON envelope).
