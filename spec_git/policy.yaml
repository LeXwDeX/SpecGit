version: 1
required_checks:
  - Required verification
verification:
  product_checks:
    - Required verification
  reuse:
    - id: github-reuse
      check: Required verification
      max_age_seconds: 120
      node: 22.23.2
      pnpm: 9.15.9
      runtime:
        archive: ci/reuse-runtime.tgz
        sha256: 11074824ad356f5ba651a3c314433ef8946c60a81a099fef7c63935e21d220e0
        lockfile: ci/runtime-lock.json
      commands:
        - - node
          - ci/test-product.cjs
          - product
      fresh_commands:
        - - node
          - ci/test-product.cjs
          - fresh
      environment: {}
      github:
        runner: ubuntu-24.04
        entry: .github/workflows/specgit-reuse.yml
  rules: []
language: en
automation:
  merge: false
  close_issues: false
