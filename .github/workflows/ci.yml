name: CI

on:
  pull_request:
    branches: [main]
    # A draft PR fails the verdict (pr_draft), so the draft→ready
    # transition must re-verdict: these runs are the required checks the
    # acceptance gate freshness-bounds (#316). Listing types replaces
    # the defaults, so the default activity types are listed alongside.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classify the complete diff with Node and Git before installing dependencies.
  changes:
    name: Detect changes
    runs-on: [self-hosted, Linux, X64]
    outputs:
      build: ${{ steps.scope.outputs.build }}
      metadata: ${{ steps.scope.outputs.metadata }}
      nix: ${{ steps.scope.outputs.nix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js for classification
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.19.0'
          package-manager-cache: false

      - name: Classify verification scope
        id: scope
        run: node scripts/ci-change-scope.mjs --verification-only

      - name: Verify classification outputs
        env:
          BUILD: ${{ steps.scope.outputs.build }}
          METADATA: ${{ steps.scope.outputs.metadata }}
          NIX: ${{ steps.scope.outputs.nix }}
        run: node -e "if (!['true','false'].includes(process.env.BUILD) || process.env.METADATA !== String(process.env.BUILD === 'false') || !['true','false'].includes(process.env.NIX) || (process.env.BUILD === 'false' && process.env.NIX !== 'false')) process.exit(1)"

  test_matrix:
    name: Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.build == 'true'
    # The Windows VM runs heavy npm/git fixtures serially and can exceed 20 minutes.
    timeout-minutes: ${{ matrix.label == 'windows-pwsh' && 60 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # #528: owner-authorized native runners, with no hosted fallback.
          - os: [self-hosted, Linux, X64]
            shell: bash
            label: linux-bash
            vitest_workers: 4
          - os: [self-hosted, macOS, ARM64]
            shell: bash
            label: macos-bash
            vitest_workers: 4
          # Windows runs serialized: with 2 workers the heavy install e2e
          # starves the vitest main process until worker RPC calls
          # ("onTaskUpdate", fixed 60s birpc timeout, no config knob in
          # vitest 3.2.6) fail as unhandled errors and redden an otherwise
          # green run (36/36 files passed). One worker keeps the runner
          # responsive; the Windows VM has a larger job budget.
          - os: [self-hosted, Windows, X64]
            shell: pwsh
            label: windows-pwsh
            vitest_workers: 1

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Verify native Windows prerequisites
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $git = Get-Command git -ErrorAction SilentlyContinue
          if ($git) {
            $gitBash = Join-Path (Split-Path (Split-Path $git.Source)) 'bin'
            if (Test-Path (Join-Path $gitBash 'bash.exe')) {
              $gitBash | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $env:Path = "$gitBash;$env:Path"
            }
          }
          if (-not (Get-Command pwsh -ErrorAction SilentlyContinue)) {
            $pwshHome = Join-Path $env:RUNNER_TOOL_CACHE 'PowerShell\7.6.6\x64'
            if (-not (Test-Path (Join-Path $pwshHome 'pwsh.exe'))) {
              $archive = Join-Path $env:RUNNER_TEMP 'PowerShell-7.6.6-win-x64.zip'
              Invoke-WebRequest 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/PowerShell-7.6.6-win-x64.zip' -OutFile $archive
              if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '02fe458be20493fbdf43f61ea20610b811ee6c738ab1676c61b9cfcd1a33c860') {
                throw 'PowerShell archive checksum mismatch.'
              }
              Expand-Archive $archive -DestinationPath $pwshHome -Force
            }
            $pwshHome | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:Path = "$pwshHome;$env:Path"
          }
          foreach ($tool in @('git', 'bash', 'pwsh')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "Missing runner prerequisite: $tool. Install it and restart the runner service."
            }
          }
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        if: needs.changes.outputs.build == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.19.0'
          package-manager-cache: false

      - name: Setup pnpm
        if: needs.changes.outputs.build == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          cache: true

      - name: Print environment diagnostics
        run: |
          node -p "JSON.stringify({ platform: process.platform, arch: process.arch, shell: process.env.SHELL || process.env.ComSpec || '' })"

      - name: Install dependencies
        if: needs.changes.outputs.build == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build project
        if: needs.changes.outputs.build == 'true'
        run: pnpm run build

      - name: Run tests
        if: needs.changes.outputs.build == 'true'
        env:
          VITEST_MAX_WORKERS: ${{ matrix.vitest_workers }}
        run: pnpm test

      - name: Upload test coverage
        if: needs.changes.outputs.build == 'true' && matrix.label == 'linux-bash'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-${{ github.event_name }}
          path: coverage/
          retention-days: 7

  lint:
    name: Lint & Type Check
    runs-on: [self-hosted, Linux, X64]
    needs: changes
    if: needs.changes.outputs.build == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        if: needs.changes.outputs.build == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.19.0'
          package-manager-cache: false

      - name: Setup pnpm
        if: needs.changes.outputs.build == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          cache: true

      - name: Install dependencies
        if: needs.changes.outputs.build == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build project
        if: needs.changes.outputs.build == 'true'
        run: pnpm run build

      - name: Type check
        if: needs.changes.outputs.build == 'true'
        run: pnpm exec tsc --noEmit

      - name: Type check tests
        if: needs.changes.outputs.build == 'true'
        run: pnpm run typecheck:test

      - name: Lint
        if: needs.changes.outputs.build == 'true'
        run: pnpm lint

      - name: Check for build artifacts
        if: needs.changes.outputs.build == 'true'
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found after build"
            exit 1
          fi
          if [ ! -f "dist/cli/index.js" ]; then
            echo "Error: CLI entry point not found"
            exit 1
          fi

  nix-flake-validate:
    name: Nix Flake Validation
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Setup Node.js for the flake update script
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.19.0'
          package-manager-cache: false

      - name: Build with Nix
        run: nix build .#legacy-engineering

      - name: Verify build output
        run: |
          if [ ! -e "result" ]; then
            echo "Error: Nix build output 'result' symlink not found"
            exit 1
          fi
          if [ ! -f "result/bin/specgit" ]; then
            echo "Error: specgit binary not found in build output"
            exit 1
          fi
          echo "✅ Build output verified"

      - name: Test binary execution
        run: |
          VERSION=$(nix run .#legacy-engineering -- --version)
          echo "SpecGit version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "Error: Version command returned empty output"
            exit 1
          fi
          echo "✅ Binary execution successful"

      - name: Validate update script
        run: |
          echo "Testing update-flake.sh script..."
          bash scripts/update-flake.sh
          echo "✅ Update script executed successfully"

      - name: Check flake.nix modifications
        run: |
          if git diff --quiet flake.nix; then
            echo "ℹ️  flake.nix unchanged (hash already up-to-date)"
          else
            echo "✅ flake.nix was updated by script"
            git diff flake.nix
          fi

      - name: Restore flake.nix
        if: always()
        run: git checkout -- flake.nix || true

  metadata:
    name: Metadata contracts
    runs-on: [self-hosted, Linux, X64]
    needs: changes
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize Node and npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.19.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.19.0'
      - name: Install verification dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate policy, records, generated assets and documentation
        run: node scripts/ci-metadata-check.mjs

  rc_verify:
    name: Package verification
    needs: changes
    if: needs.changes.outputs.build == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/rc-verify.yml

  rust:
    name: Rust (${{ matrix.label }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    # Allow the Windows VM to finish both source and installed regressions.
    timeout-minutes: ${{ matrix.label == 'windows' && 60 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: [self-hosted, Linux, X64]
            label: linux
            target: x86_64-unknown-linux-gnu
          - os: [self-hosted, macOS, ARM64]
            label: macos
            target: aarch64-apple-darwin
          - os: [self-hosted, Windows, X64]
            label: windows
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
        working-directory: runtime
    steps:
      - name: Verify native Windows build prerequisites
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: .
        run: |
          $git = Get-Command git -ErrorAction SilentlyContinue
          if ($git) {
            $gitBash = Join-Path (Split-Path (Split-Path $git.Source)) 'bin'
            if (Test-Path (Join-Path $gitBash 'bash.exe')) {
              $gitBash | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $env:Path = "$gitBash;$env:Path"
            }
          }
          foreach ($tool in @('git', 'bash')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "Missing runner prerequisite: $tool. Install it and restart the runner service."
            }
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = if (Test-Path $vswhere) { & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath }
          if (-not $installation) {
            $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
            $principal = New-Object Security.Principal.WindowsPrincipal($identity)
            if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
              throw 'MSVC build tools are missing. Install the C++ desktop workload and Windows SDK as administrator, then retry.'
            }
            $installer = Join-Path $env:RUNNER_TEMP 'vs-BuildTools-17.14.40.exe'
            Invoke-WebRequest 'https://download.visualstudio.microsoft.com/download/pr/f8d58e41-102a-4347-a567-60d7235da3b5/aac092d0d839fd078e86b301d886130f1605891061242b36facf55ccbdd5a0a7/vs_BuildTools.exe' -OutFile $installer
            if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne 'aac092d0d839fd078e86b301d886130f1605891061242b36facf55ccbdd5a0a7') {
              throw 'MSVC installer checksum mismatch.'
            }
            $setup = Start-Process $installer -ArgumentList @('--quiet', '--wait', '--norestart', '--add', 'Microsoft.VisualStudio.Workload.VCTools', '--includeRecommended') -Wait -PassThru
            if ($setup.ExitCode -eq 3010) { throw 'MSVC installation requires a Windows reboot before retrying native verification.' }
            if ($setup.ExitCode -ne 0) { throw "MSVC installation failed with exit code $($setup.ExitCode)." }
            $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $installation) { throw 'MSVC installation did not provide the required x64 build tools.' }
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20.19.0'
          package-manager-cache: false
      - name: Rust formatting and lint
        timeout-minutes: ${{ matrix.label == 'windows' && 60 || 15 }}
        run: node scripts/native-resume.mjs --phase lint --target '${{ matrix.target }}'
      - name: Compile native test executables
        timeout-minutes: ${{ matrix.label == 'windows' && 60 || 15 }}
        run: node scripts/native-resume.mjs --phase compile-tests --target '${{ matrix.target }}'
      - name: Rust public interface and real subprocess regressions
        timeout-minutes: ${{ matrix.label == 'windows' && 60 || 15 }}
        run: node scripts/native-resume.mjs --phase source-tests --target '${{ matrix.target }}'
      - name: Native distribution regressions
        timeout-minutes: ${{ matrix.label == 'windows' && 60 || 15 }}
        run: node scripts/native-resume.mjs --phase distribution-tests --target '${{ matrix.target }}'
      - name: Compile remapped release executable
        timeout-minutes: ${{ matrix.label == 'windows' && 60 || 15 }}
        run: node scripts/native-resume.mjs --phase compile-release --target '${{ matrix.target }}'
      - name: Install packages with scripts disabled
        timeout-minutes: ${{ matrix.label == 'windows' && 60 || 15 }}
        run: node scripts/native-resume.mjs --phase install --target '${{ matrix.target }}'
      - name: Repeat public journeys through the installed npm entrypoint
        timeout-minutes: ${{ matrix.label == 'windows' && 60 || 15 }}
        run: node scripts/native-resume.mjs --phase profile --target '${{ matrix.target }}'
      - name: Retain installed artifacts and complete test accounting
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-qualification-${{ matrix.target }}-${{ github.run_attempt }}
          path: |
            ${{ env.SPECGIT_NATIVE_PROFILE }}/
            ${{ env.SPECGIT_NATIVE_INSTALLED }}/*.tgz
            ${{ env.SPECGIT_NATIVE_INSTALLED }}/installed.json
          retention-days: 7

  required_verification:
    name: Required verification
    runs-on: [self-hosted, Linux, X64]
    needs: [changes, metadata, test_matrix, lint, nix-flake-validate, rc_verify, rust]
    if: always()
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.19.0'
          package-manager-cache: false
      - name: Require every applicable verification result
        env:
          CLASSIFIER_RESULT: ${{ needs.changes.result }}
          METADATA_RESULT: ${{ needs.metadata.result }}
          BUILD_REQUIRED: ${{ needs.changes.outputs.build }}
          NIX_REQUIRED: ${{ needs.changes.outputs.nix }}
          MATRIX_RESULT: ${{ needs.test_matrix.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          RC_RESULT: ${{ needs.rc_verify.result }}
          NIX_RESULT: ${{ needs.nix-flake-validate.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          node --input-type=module <<'NODE'
          const { CLASSIFIER_RESULT, METADATA_RESULT, BUILD_REQUIRED, NIX_REQUIRED } = process.env;
          if (CLASSIFIER_RESULT !== 'success' || METADATA_RESULT !== 'success' ||
              !['true', 'false'].includes(BUILD_REQUIRED) || !['true', 'false'].includes(NIX_REQUIRED) ||
              (BUILD_REQUIRED === 'false' && NIX_REQUIRED !== 'false')) {
            console.error('Complete classification and metadata validation are required.');
            process.exit(1);
          }
          for (const [name, required] of Object.entries({
            MATRIX_RESULT: BUILD_REQUIRED, LINT_RESULT: BUILD_REQUIRED,
            RC_RESULT: BUILD_REQUIRED, NIX_RESULT: NIX_REQUIRED, RUST_RESULT: BUILD_REQUIRED,
          })) {
            const expected = required === 'true' ? 'success' : 'skipped';
            if (process.env[name] !== expected) {
              console.error(`${name}: expected ${expected}, got ${process.env[name]}`);
              process.exit(1);
            }
          }
          console.log('All applicable verification passed; non-applicable product jobs were not executed.');
          NODE

# specgit:ci-acceptance:start
  specgit-acceptance:
    needs: required_verification
    if: always() && github.event_name == 'pull_request'
    name: SpecGit Acceptance
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
      checks: read
      statuses: read
    # The repository owner requires self-hosted execution for all CI/CD.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin execution to this event; a newer branch push must not change
          # the code tested by an older run. Manual dispatch uses its own SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Restore the event branch
        if: github.event_name == 'pull_request' || github.ref_type == 'branch'
        env:
          SPECGIT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git check-ref-format --branch "$SPECGIT_BRANCH" >/dev/null
          git switch --create "$SPECGIT_BRANCH"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.19.0'
          package-manager-cache: false
          # No dependency cache here, by design (#66): this job checks out
          # and executes untrusted PR code (install scripts, build, the CLI
          # under verdict), so it must never write to or restore from the
          # repository cache (CodeQL alerts 7-9). ci.yml keeps the warm,
          # branch-scoped cache.

      - name: Classify CI scope
        id: scope
        run: node scripts/ci-change-scope.mjs --verification-only

      - name: Validate CI scope
        env:
          CI_BUILD: ${{ steps.scope.outputs.build }}
        run: test "$CI_BUILD" = true || test "$CI_BUILD" = false

      - name: Setup pnpm
        if: steps.scope.outputs.build == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install product dependencies
        if: steps.scope.outputs.build == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build CLI
        if: steps.scope.outputs.build == 'true'
        run: pnpm run build

      - name: Checkout trusted engineering source for metadata validation
        if: steps.scope.outputs.build == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: .specgit-engineering

      - name: Setup engineering pnpm
        if: steps.scope.outputs.build == 'false'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: .specgit-engineering/package.json

      - name: Isolate trusted engineering source
        if: steps.scope.outputs.build == 'false'
        run: |
          if [ -e "$RUNNER_TEMP/specgit-cli" ] || [ -L "$RUNNER_TEMP/specgit-cli" ]; then
            echo 'Engineering runtime destination already exists; refusing to reuse it.' >&2
            exit 1
          fi
          mv .specgit-engineering "$RUNNER_TEMP/specgit-cli"

      - name: Build trusted engineering CLI for metadata validation
        if: steps.scope.outputs.build == 'false'
        working-directory: ${{ runner.temp }}/specgit-cli
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node build.js

      - name: Prepare approved policy for acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          SPECGIT_WAIT_POLICY: ${{ runner.temp }}/specgit-policy.yaml
          SPECGIT_POLICY_ENTRY: ${{ steps.scope.outputs.build == 'false' && format('{0}/specgit-cli/dist/automation/workflow-policy.js', runner.temp) || 'dist/automation/workflow-policy.js' }}
        run: |
          gh auth setup-git
          node "$SPECGIT_POLICY_ENTRY"

      - name: specgit finish
        if: steps.scope.outputs.build == 'true'
        run: |
          node --input-type=module <<'SPECGIT_ACCEPTANCE'
          // Managed by SpecGit: acceptance checkout adapter.
          import { execFileSync, spawnSync } from 'node:child_process';
          import { mkdirSync, mkdtempSync, rmSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { isAbsolute, join } from 'node:path';
          import { pathToFileURL } from 'node:url';

          /** Reproduce worktree identity at the event head; ordinary gates still own acceptance. */
          export async function withAcceptanceCheckout(root, run, { readRecord, git, bindingContextMismatch }) {
            const record = await readRecord(root);
            if (!record.ok || record.value.context.kind !== 'worktree') return run(root);
            const context = record.value.context;
            const facts = await git.facts(root);
            if (facts.branch !== context.branch || facts.dirty !== false || !facts.headSha ||
                bindingContextMismatch(context, facts) === null) return run(root);
            const label = context.label;
            if (label === '.' || label === '..' || /[\\/:*?"<>|\p{Cc}]/u.test(label) || /[. ]$/.test(label) ||
                /^(?:con|prn|aux|nul|com[1-9]|lpt[1-9])(?:\.|$)/i.test(label)) throw new Error('Unsafe worktree label in delivery record.');
            const parent = mkdtempSync(join(tmpdir(), 'specgit-acceptance-'));
            const hooks = join(parent, 'hooks');
            const checkout = join(parent, 'checkout', label);
            mkdirSync(hooks); mkdirSync(join(parent, 'checkout'));
            const gitCommand = (cwd, args) => execFileSync('git', ['-C', cwd, '-c', `core.hooksPath=${hooks}`, ...args], {
              encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'], timeout: 60_000, maxBuffer: 4 * 1024 * 1024,
            }).trim();
            let registered = false;
            try {
              gitCommand(root, ['worktree', 'add', '--detach', checkout, facts.headSha]);
              registered = true;
              // Only the new worktree's HEAD changes. The existing branch ref and original checkout stay intact.
              gitCommand(checkout, ['symbolic-ref', 'HEAD', `refs/heads/${context.branch}`]);
              if (gitCommand(checkout, ['rev-parse', 'HEAD']) !== facts.headSha) throw new Error('The event branch changed while preparing acceptance.');
              return await run(checkout);
            } finally {
              if (registered) gitCommand(root, ['worktree', 'remove', '--force', checkout]);
              rmSync(parent, { recursive: true, force: true });
            }
          }

          /** Explicit CI preparation step; only a detached source-head checkout can create an event branch. */
          export function prepareGitlabEventBranch(root = process.cwd(), env = process.env) {
            const branch = env.CI_MERGE_REQUEST_SOURCE_BRANCH_NAME || env.CI_COMMIT_BRANCH;
            const sha = env.CI_COMMIT_SHA;
            if (!branch || !/^(?:[a-f0-9]{40}|[a-f0-9]{64})$/.test(sha ?? '') ||
                (env.CI_MERGE_REQUEST_EVENT_TYPE && env.CI_MERGE_REQUEST_EVENT_TYPE !== 'detached')) {
              throw new Error('A GitLab source-branch pipeline and exact event SHA are required.');
            }
            const hooks = mkdtempSync(join(tmpdir(), 'specgit-event-hooks-'));
            const git = (args) => execFileSync('git', ['-C', root, '-c', `core.hooksPath=${hooks}`, ...args], {
              encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'], timeout: 60_000,
            }).trim();
            try {
              git(['check-ref-format', '--branch', branch]);
              if (git(['rev-parse', 'HEAD']) !== sha) throw new Error('The checkout differs from the GitLab event SHA.');
              const current = git(['branch', '--show-current']);
              if (current === branch) return;
              if (current !== '') throw new Error('The checkout belongs to a different branch.');
              git(['switch', '--create', branch]);
            } finally { rmSync(hooks, { recursive: true, force: true }); }
          }

          /** Run the installed public verdict with the same source and binding. */
          export async function acceptanceMain() {
            try {
              const runtime = process.env.SPECGIT_ACCEPT_RUNTIME;
              if (!runtime || !isAbsolute(runtime)) throw new Error('An absolute installed SpecGit runtime path is required.');
              const load = (file) => import(pathToFileURL(join(runtime, file)).href);
              const [{ readRecord }, { LocalGitAdapter }, { bindingContextMismatch }] = await Promise.all([
                load('dist/record/io.js'), load('dist/gitfacts/local.js'), load('dist/record/context-match.js'),
              ]);
              process.exitCode = await withAcceptanceCheckout(process.cwd(), async (checkout) => {
                const result = spawnSync(process.execPath, [join(runtime, 'bin/specgit.js'), 'finish', '--json'], {
                  cwd: checkout, stdio: 'inherit',
                });
                if (result.error || result.signal || result.status === null) throw new Error('The verdict process did not complete.');
                return result.status;
              }, { readRecord, git: new LocalGitAdapter(), bindingContextMismatch });
            } catch {
              console.error('Acceptance checkout preparation failed; restore the declared context and retry.');
              process.exitCode = 3;
            }
          }

          if (process.argv[2] === '--prepare-gitlab-event') prepareGitlabEventBranch();
          else await acceptanceMain();
          SPECGIT_ACCEPTANCE
        env:
          SPECGIT_ACCEPT_RUNTIME: ${{ github.workspace }}
          GH_TOKEN: ${{ github.token }}

      - name: specgit finish with trusted CLI
        if: steps.scope.outputs.build == 'false'
        run: |
          node --input-type=module <<'SPECGIT_ACCEPTANCE'
