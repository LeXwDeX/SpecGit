name: CI

on:
  pull_request:
    branches: [main]
    # A draft PR fails the verdict (pr_draft), so the draft→ready
    # transition must re-verdict: these runs are the required checks the
    # acceptance gate freshness-bounds (#316). Listing types replaces
    # the defaults, so the default activity types are listed alongside.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classify the complete diff with Node and Git before installing dependencies.
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.scope.outputs.build }}
      metadata: ${{ steps.scope.outputs.metadata }}
      rust_matrix: ${{ steps.rust-matrix.outputs.rust_matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js for classification
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.19.0'
          package-manager-cache: false

      - name: Classify verification scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            printf 'build=true\nmetadata=false\ndependencies=true\n' >> "$GITHUB_OUTPUT"
          else
            git show "$BASE_SHA:scripts/ci-change-scope.mjs" > "$RUNNER_TEMP/ci-change-scope.mjs"
            node "$RUNNER_TEMP/ci-change-scope.mjs" --verification-only
          fi

      - name: Verify classification outputs
        env:
          BUILD: ${{ steps.scope.outputs.build }}
          METADATA: ${{ steps.scope.outputs.metadata }}
        run: node -e "if (!['true','false'].includes(process.env.BUILD) || process.env.METADATA !== String(process.env.BUILD === 'false')) process.exit(1)"

      - name: Select the Rust platform matrix
        id: rust-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          linux='{"os":"ubuntu-24.04","label":"linux","target":"x86_64-unknown-linux-gnu","runs_on":"[\"self-hosted\",\"Linux\",\"X64\",\"azure-f16\"]","hosted_runs_on":"[\"ubuntu-24.04\"]"}'
          macos='{"os":"macos-15","label":"macos","target":"aarch64-apple-darwin","runs_on":"[\"macos-15\"]","hosted_runs_on":"[\"macos-15\"]"}'
          if [ "$EVENT_NAME" = "pull_request" ]; then
            printf 'rust_matrix={"include":[%s]}\n' "$linux" >> "$GITHUB_OUTPUT"
          else
            printf 'rust_matrix={"include":[%s,%s]}\n' "$linux" "$macos" >> "$GITHUB_OUTPUT"
          fi

  metadata:
    name: Native repository contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20.19.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --test scripts/tests/*.test.mjs
      - run: node scripts/ci-metadata-check.mjs

  rust:
    name: Rust (${{ matrix.label }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    # 可信事件用 Azure；fork PR 用 GitHub 托管 runner，不能让 fork 的代码上自托管机器。
    runs-on: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(matrix.runs_on) || fromJSON(matrix.hosted_runs_on) }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # PR events receive only the Linux entry; main pushes receive Linux and macOS.
      matrix: ${{ fromJSON(needs.changes.outputs.rust_matrix) }}
    defaults:
      run:
        shell: bash
        working-directory: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify hosted macOS ARM64 toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = arm64
          xcrun --find clang
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20.19.0'
          package-manager-cache: false
      - name: Rust formatting and lint
        timeout-minutes: 15
        run: node scripts/native-resume.mjs --phase lint --target '${{ matrix.target }}'
      - name: Compile native test executables
        timeout-minutes: 15
        run: node scripts/native-resume.mjs --phase compile-tests --target '${{ matrix.target }}'
      - name: Rust public interface and real subprocess regressions
        timeout-minutes: 15
        run: node scripts/native-resume.mjs --phase source-tests --target '${{ matrix.target }}'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        if: runner.os != 'macOS'
        with:
          python-version: '3.13'
      - name: Check the existing macOS Python ZIP support
        if: runner.os == 'macOS'
        run: python3 -c 'import sys, zipfile; sys.exit(0 if sys.version_info >= (3, 9) else 1)'
      - name: Native distribution regressions
        timeout-minutes: 15
        run: node scripts/native-resume.mjs --phase distribution-tests --target '${{ matrix.target }}'
      - name: Compile remapped release executable
        timeout-minutes: 15
        run: node scripts/native-resume.mjs --phase compile-release --target '${{ matrix.target }}'
      - name: Install native executable
        timeout-minutes: 15
        run: node scripts/native-resume.mjs --phase install --target '${{ matrix.target }}'
      - name: Repeat public journeys through the installed native executable
        timeout-minutes: 15
        run: node scripts/native-resume.mjs --phase profile --target '${{ matrix.target }}'
      # A failure before native-resume starts leaves both paths empty. An
      # empty upload path expands to `/` and scans the whole filesystem.
      - name: Retain installed artifacts and complete test accounting
        if: always() && env.SPECGIT_NATIVE_PROFILE != '' && env.SPECGIT_NATIVE_INSTALLED != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-qualification-${{ matrix.target }}-${{ github.run_attempt }}
          path: |
            ${{ env.SPECGIT_NATIVE_PROFILE }}/
            ${{ env.SPECGIT_NATIVE_INSTALLED }}/specgit*
            ${{ env.SPECGIT_NATIVE_INSTALLED }}/installed.json
          retention-days: 7

  required_verification:
    name: Required verification
    runs-on: ubuntu-24.04
    needs: [changes, metadata, rust]
    if: always()
    steps:
      - name: Require every applicable verification result
        env:
          CLASSIFIER_RESULT: ${{ needs.changes.result }}
          METADATA_RESULT: ${{ needs.metadata.result }}
          BUILD_REQUIRED: ${{ needs.changes.outputs.build }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          test "$CLASSIFIER_RESULT" = success
          test "$METADATA_RESULT" = success
          case "$BUILD_REQUIRED" in
            true) test "$RUST_RESULT" = success ;;
            false) test "$RUST_RESULT" = skipped ;;
            *) exit 1 ;;
          esac

  acceptance:
    name: SpecGit Acceptance
    runs-on: ubuntu-24.04
    needs: required_verification
    if: always()
    steps:
      - name: Require native verification and a ready request
        env:
          VERIFICATION_RESULT: ${{ needs.required_verification.result }}
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_TARGET: ${{ github.event.pull_request.base.ref }}
        run: |
          test "$VERIFICATION_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$PR_DRAFT" = false
            test "$PR_TARGET" = main
          fi
