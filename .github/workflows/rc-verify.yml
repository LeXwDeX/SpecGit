name: RC Verify

# Safe release-candidate verification (#71): prove everything a real
# publish needs — build, tarball shape, registry reachability, and the
# npm OIDC provenance chain — WITHOUT publishing. The only registry
# interactions are read-only (npm view) and `npm publish --dry-run`,
# which never uploads. The final publish stays in release-prepare.yml:
# PR-gated (a merged version PR) and OIDC-based (id-token + --provenance).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # dry-run provenance: prove the OIDC chain pre-publish

concurrency:
  group: rc-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rc-verify:
    name: RC Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 ships npm 11.5+, required for OIDC trusted publishing
          # and provenance — the same chain the real publish uses.
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Verify the packed tarball carries the CLI
        run: pnpm run check:pack-version

      - name: Pack and verify the tarball shape
        run: |
          # --ignore-scripts: the build already ran; letting pack run the
          # prepare lifecycle would pollute the JSON output with build logs.
          npm pack --json --silent --ignore-scripts > pack.json
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const [tar] = JSON.parse(readFileSync('pack.json', 'utf8'));
          const files = tar.files.map((f) => f.path);
          const must = ['bin/specgit.js', 'dist/cli/index.js'];
          const missing = must.filter((p) => !files.includes(p));
          if (missing.length > 0) {
            console.error('Missing from tarball: ' + missing.join(', '));
            process.exit(1);
          }
          if (tar.name !== pkg.name || tar.version !== pkg.version) {
            console.error(`tarball ${tar.name}@${tar.version} != package.json ${pkg.name}@${pkg.version}`);
            process.exit(1);
          }
          console.log(`Tarball OK: ${tar.name}@${tar.version} (${tar.filename}, ${files.length} files)`);
          EOF

      - name: Registry reachability and dist-tag baseline (read-only)
        run: npm view specgit version dist-tags --json

      - name: Dry-run publish (never uploads)
        run: npm publish --dry-run --ignore-scripts

      # Fork pull requests cannot be granted id-token: write, so the
      # provenance proof runs on same-repo PRs and manual dispatch only.
      - name: Prove OIDC provenance before any real publish
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.fork == false }}
        run: |
          set -e
          # Audience probe: this runner can mint an npm-audience OIDC token.
          curl -sSf -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npmjs.org" | tee oidc.json
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          const { value } = JSON.parse(readFileSync('oidc.json', 'utf8'));
          const parts = value.split('.');
          if (parts.length !== 3) {
            console.error('OIDC response is not a JWT');
            process.exit(1);
          }
          console.log('OIDC token minted for audience npmjs.org (' + value.length + ' chars)');
          EOF
          npm publish --dry-run --ignore-scripts --provenance

      - name: Note the fork limitation (visible, never silent)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true }}
        run: |
          echo "::warning::Provenance dry-run skipped: fork pull requests cannot be granted id-token: write. Provenance is proven on same-repo PRs and in the release job."
