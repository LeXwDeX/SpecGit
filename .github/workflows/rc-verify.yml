name: RC Verify

# Retained offline TypeScript engineering package checks. GitHub native
# releases use compile-and-smoke verification in release-prepare.yml.
# npm registry, publication and OIDC flows are retired.

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      windows_diagnostics:
        description: 'Run bounded Windows installation diagnostics (not acceptance)'
        type: boolean
        default: false
      windows_observer_diagnostics:
        description: 'Diagnose Windows observer regressions (not acceptance)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rc-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rc-verify:
    if: ${{ !inputs.windows_diagnostics && !inputs.windows_observer_diagnostics }}
    name: RC Verify
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The runner's action runtime is not a complete user-facing npm install.
      # Bootstrap Node before pnpm; restore the pnpm cache after pnpm exists.
      - name: Initialize Node and npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm run build

      - name: Verify the packed tarball carries the CLI
        run: pnpm run check:pack-version
        # Verify the build above; npm pack would otherwise invoke prepare again.
        env:
          npm_config_ignore_scripts: 'true'

      - name: Pack and verify the tarball shape
        run: |
          # --ignore-scripts: the build already ran; letting pack run the
          # prepare lifecycle would pollute the JSON output with build logs.
          npm pack --json --silent --ignore-scripts > pack.json
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const [tar] = JSON.parse(readFileSync('pack.json', 'utf8'));
          const files = tar.files.map((f) => f.path);
          const must = ['bin/specgit.js', 'dist/cli/index.js'];
          const missing = must.filter((p) => !files.includes(p));
          if (missing.length > 0) {
            console.error('Missing from tarball: ' + missing.join(', '));
            process.exit(1);
          }
          if (tar.name !== pkg.name || tar.version !== pkg.version) {
            console.error(`tarball ${tar.name}@${tar.version} != package.json ${pkg.name}@${pkg.version}`);
            process.exit(1);
          }
          console.log(`Tarball OK: ${tar.name}@${tar.version} (${tar.filename}, ${files.length} files)`);
          EOF

  windows-diagnostics:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_diagnostics }}
    name: Windows installation diagnostics
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Verify Windows shell prerequisites
        shell: powershell
        run: |
          # This runner exposes the cached PowerShell only after adding GITHUB_PATH.
          # Bootstrap with built-in Windows PowerShell, as the normal CI job does.
          if (-not (Get-Command pwsh -ErrorAction SilentlyContinue)) {
            $pwshHome = Join-Path $env:RUNNER_TOOL_CACHE 'PowerShell\7.6.6\x64'
            if (-not (Test-Path (Join-Path $pwshHome 'pwsh.exe'))) {
              throw 'Pinned PowerShell 7.6.6 is missing from the existing runner tool cache.'
            }
            $pwshHome | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          $git = Get-Command git -ErrorAction Stop
          $gitBash = Join-Path (Split-Path (Split-Path $git.Source)) 'bin'
          if (Test-Path (Join-Path $gitBash 'bash.exe')) {
            $gitBash | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.19.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - name: Measure installation tests and isolated cache controls
        timeout-minutes: 14
        run: ./scripts/windows-install-diagnose.ps1
      - name: Upload sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-install-diagnostics
          path: ${{ runner.temp }}/specgit-install-diagnostics/public/
          if-no-files-found: warn

  windows-observer-diagnostics:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_observer_diagnostics }}
    name: Windows observer diagnostics
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Locate the existing Windows shells
        shell: powershell
        run: |
          if (-not (Get-Command pwsh -ErrorAction SilentlyContinue)) {
            $pwshHome = Join-Path $env:RUNNER_TOOL_CACHE 'PowerShell\7.6.6\x64'
            if (-not (Test-Path (Join-Path $pwshHome 'pwsh.exe'))) {
              throw 'Pinned PowerShell 7.6.6 is missing from the existing runner tool cache.'
            }
            $pwshHome | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          $git = Get-Command git -ErrorAction Stop
          $gitBash = Join-Path (Split-Path (Split-Path $git.Source)) 'bin'
          if (-not (Test-Path (Join-Path $gitBash 'bash.exe'))) {
            throw 'The existing Git installation does not provide Git Bash.'
          }
          $gitBash | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.0
      - name: Diagnose observer lifecycle with unchanged deadlines
        timeout-minutes: 60
        run: ./scripts/windows-watch-diagnose.ps1
      - name: Upload observer diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-observer-diagnostics
          path: ${{ runner.temp }}/specgit-watch-${{ github.run_id }}-${{ github.run_attempt }}/public/
          if-no-files-found: error
          retention-days: 7
