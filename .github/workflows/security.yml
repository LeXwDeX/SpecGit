name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published advisory surfaces even with no commits.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: [self-hosted, Linux, X64]
    outputs:
      dependencies: ${{ steps.changes.outputs.dependencies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Classify the complete change
        id: changes
        run: node scripts/ci-change-scope.mjs --verification-only
      - name: Verify classification outputs
        env:
          DEPENDENCIES: ${{ steps.changes.outputs.dependencies }}
        run: node -e "if (!['true','false'].includes(process.env.DEPENDENCIES)) process.exit(1)"

  # Blocks a pull request that introduces a vulnerable or badly licensed dependency.
  dependency-review:
    name: Dependency Review
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.dependencies == 'true'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No PR comment: that needs `pull-requests: write`, which a fork's token
      # never gets. The failed check plus its log is the signal.
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  audit:
    name: Audit
    needs: scope
    if: needs.scope.outputs.dependencies == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.0
      - name: Install pinned Cargo auditor
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit native dependencies
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: cargo audit --file runtime/Cargo.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20.19.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Audit private verification tooling
        continue-on-error: true
        run: pnpm audit --audit-level high
