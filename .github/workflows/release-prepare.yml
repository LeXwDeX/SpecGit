name: Release

# Release on merge to main, through version pull requests (main is
# PR-only for every actor, including this workflow's GITHUB_TOKEN):
#
# 1. push to main with pending changesets -> open (or force-update) the
#    branch changeset-release/main carrying the consumed bump commit
#    "chore(release): v<version>" as a PR with auto-merge enabled.
# 2. that PR merges (SpecGit Acceptance passes via its no-record skip
#    path) -> push to main with no pending changesets and a head commit
#    matching "chore(release): v" -> publish to npm, tag, GitHub Release.
on:
  push:
    branches: [main]

permissions:
  contents: write # tag push + GitHub Release + version branch
  pull-requests: write # create/merge the version pull request
  id-token: write # npm OIDC trusted publishing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'LeXwDeX/SpecGit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24' # Node 24 ships npm 11.5.1+ required for OIDC trusted publishing
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Count pending changesets
        id: pending
        run: |
          COUNT=$(ls .changeset/*.md 2>/dev/null | grep -v 'README' | wc -l | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Pending changesets: $COUNT"

      # Push with pending changesets: propose the version PR.
      - name: Open version pull request
        if: steps.pending.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          # @changesets/changelog-github needs a token to link PRs in the
          # generated changelog entries (separate from gh's GH_TOKEN).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "specgit-release-bot"
          git config user.email "noreply@users.noreply.github.com"
          git checkout -B changeset-release/main
          pnpm exec changeset version
          VERSION=$(node -p "require('./package.json').version")
          git commit -am "chore(release): v${VERSION}"
          git push --force origin changeset-release/main
          BODY="Automated version bump. Merging publishes specgit@${VERSION} to npm and tags v${VERSION}."
          gh pr create --base main --head changeset-release/main \
            --title "chore(release): v${VERSION}" --body "$BODY" \
            || gh pr edit changeset-release/main --title "chore(release): v${VERSION}" --body "$BODY"
          gh pr merge changeset-release/main --auto --squash --delete-branch

      # Push without pending changesets whose head is a version bump: publish.
      - name: Build
        if: "steps.pending.outputs.count == '0' && startsWith(github.event.head_commit.message, 'chore(release): v')"
        run: pnpm run build

      - name: Publish to npm
        if: "steps.pending.outputs.count == '0' && startsWith(github.event.head_commit.message, 'chore(release): v')"
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "specgit@${VERSION}" version >/dev/null 2>&1; then
            echo "specgit@${VERSION} is already on npm; skipping publish."
            exit 0
          fi
          pnpm run check:pack-version
          # npm authentication via OIDC trusted publishing (id-token: write
          # + registry-url): no environment binding, no token.
          npm publish --access public

      - name: Tag and create GitHub Release
        if: "steps.pending.outputs.count == '0' && startsWith(github.event.head_commit.message, 'chore(release): v')"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin; skipping tag push."
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; skipping."
            exit 0
          fi
          gh release create "${TAG}" --generate-notes --title "${TAG}" \
            --notes "Automated release from merged changesets. npm: https://www.npmjs.com/package/specgit/v/${VERSION}"
