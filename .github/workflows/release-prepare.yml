# Explicit main-branch release: compile, smoke-test, then publish three native binaries.
name: Release
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Exact stable Cargo/workspace/package version
        type: string
        default: 2.0.0
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build native release (${{ matrix.label }})
    if: github.repository == 'LeXwDeX/SpecGit' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os:
              - self-hosted
              - Linux
              - X64
            label: linux
            target: x86_64-unknown-linux-gnu
          - os:
              - self-hosted
              - macOS
              - ARM64
            label: macos
            target: aarch64-apple-darwin
          - os:
              - self-hosted
              - Windows
              - X64
            label: windows
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
        working-directory: runtime
    steps:
      - name: Locate the existing Git Bash installation
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: .
        run: |-
          $git = Get-Command git -ErrorAction Stop
          $gitBash = Join-Path (Split-Path (Split-Path $git.Source)) "bin"
          if (-not (Test-Path (Join-Path $gitBash "bash.exe"))) { throw "Install Git Bash and the MSVC C++ workload before retrying." }
          $gitBash | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20.19.0
          package-manager-cache: false
      - name: Check exact stable version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: node distribution/release-version.mjs --version "$RELEASE_VERSION"
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.0
      - name: Compile and smoke-test native executable
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: node distribution/native-release.mjs --build --target '${{ matrix.target }}' --output "$RUNNER_TEMP/specgit-native-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}" --version "$RELEASE_VERSION" --source "$GITHUB_SHA"
      - name: Retain the binary and smoke evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-platform-${{ matrix.target }}
          path: ${{ runner.temp }}/specgit-native-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 14
          if-no-files-found: error

  assemble:
    needs: build
    permissions:
      contents: write
      actions: read
    runs-on:
      - self-hosted
      - Linux
      - X64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20.19.0
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-platform-*
          path: ${{ runner.temp }}/specgit-release-input-${{ github.run_id }}-${{ github.run_attempt }}
          digest-mismatch: error
      - name: Assemble the three smoke-tested binaries
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: node runtime/distribution/native-release.mjs --assemble --input "$RUNNER_TEMP/specgit-release-input-${{ github.run_id }}-${{ github.run_attempt }}" --output "$RUNNER_TEMP/specgit-release-bundle-${{ github.run_id }}-${{ github.run_attempt }}" --version "$RELEASE_VERSION" --source "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: specgit-release-${{ github.sha }}
          path: ${{ runner.temp }}/specgit-release-bundle-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14
      - name: Publish native binaries to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: node runtime/distribution/publish.mjs --directory "$RUNNER_TEMP/specgit-release-bundle-${{ github.run_id }}-${{ github.run_attempt }}" --version "$RELEASE_VERSION" --source "$GITHUB_SHA" --build-run "$GITHUB_RUN_ID" --github
