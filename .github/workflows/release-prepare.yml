name: Release

# Release on merge to main, through version pull requests (main is
# PR-only for every actor, including this workflow's GITHUB_TOKEN):
#
# 1. push to main with pending changesets -> open (or force-update) the
#    branch changeset-release/main carrying the consumed bump commit
#    "chore(release): v<version>" as a PR held open as the manual
#    batch-decision point (auto-merge armed off, #102).
# 2. that PR merges (SpecGit Acceptance passes via its no-record skip
#    path) -> push to main with no pending changesets and a head commit
#    matching "chore(release): v" -> publish to npm, tag, GitHub Release.
on:
  push:
    branches: [main]

permissions:
  contents: write # tag push + GitHub Release + version branch
  pull-requests: write # create/merge the version pull request
  id-token: write # npm OIDC trusted publishing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'LeXwDeX/SpecGit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24' # Node 24 ships npm 11.5.1+ required for OIDC trusted publishing
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Count pending changesets
        id: pending
        run: |
          # Pre-mode aware: changesets consumed into a prerelease are
          # recorded in .changeset/pre.json and STAY on disk (they are
          # re-applied on `changeset pre exit`). They are not pending.
          # Count only changesets pre.json does not list; without pre.json
          # this is identical to counting every non-README *.md.
          COUNT=$(node -e "const fs=require('fs');let consumed=[];try{consumed=JSON.parse(fs.readFileSync('.changeset/pre.json','utf8')).changesets||[]}catch{};let files=[];try{files=fs.readdirSync('.changeset')}catch{};const pending=files.filter(f=>f.endsWith('.md')&&f!=='README.md').map(f=>f.replace(/\.md$/,'')).filter(id=>!consumed.includes(id));console.log(pending.length)")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Pending changesets: $COUNT"

      # Push with pending changesets: propose the version PR.
      - name: Open version pull request
        if: steps.pending.outputs.count != '0'
        env:
          # PR #61 root cause, proven: a version branch pushed with the bare
          # repository GITHUB_TOKEN lands as github-actions[bot], and every
          # pull_request workflow on the version PR then completes as
          # action_required with zero jobs — the required checks can never
          # finish and the PR blocks forever. RELEASE_BOT_TOKEN (a PAT or
          # GitHub App installation token with contents + pull-requests
          # write) pushes as an actor whose events run without approval.
          # Without it the workflow still runs, and the watchdog step below
          # fails loudly instead of letting the PR stall silently.
          PUSH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
          # @changesets/changelog-github needs a token to link PRs in the
          # generated changelog entries (separate from gh's GH_TOKEN).
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
        run: |
          git config user.name "specgit-release-bot"
          git config user.email "noreply@users.noreply.github.com"
          git checkout -B changeset-release/main
          pnpm exec changeset version
          VERSION=$(node -p "require('./package.json').version")
          git commit -am "chore(release): v${VERSION}"
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin changeset-release/main
          BODY="Automated version bump. Merging publishes specgit@${VERSION} to npm and tags v${VERSION}."
          # create may fail on permissions; the branch may also still carry
          # the PREVIOUS (merged) version PR — that only means this version
          # shipped if its tag exists. Decide by tag, never by PR state.
          if ! gh pr create --base main --head changeset-release/main \
            --title "chore(release): v${VERSION}" --body "$BODY"; then
            if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
              echo "Tag v${VERSION} already exists; v${VERSION} already shipped. Nothing to do."
              exit 0
            fi
            STATE=$(gh pr view changeset-release/main --json state --jq .state 2>/dev/null || echo MISSING)
            if [ "$STATE" = "OPEN" ]; then
              # Explicit supersession (#71): record the rationale on the
              # superseded proposal before retitling — never silently
              # repurpose an open version PR.
              gh pr comment changeset-release/main --body "Superseded: this version PR now carries v${VERSION} via the release-candidate gates (#71). Nothing was published for the earlier proposal." || true
              gh pr edit changeset-release/main --title "chore(release): v${VERSION}" --body "$BODY"
            else
              # MERGED/CLOSED for an older version (tag absent): recreate.
              gh pr create --base main --head changeset-release/main \
                --title "chore(release): v${VERSION}" --body "$BODY" || {
                echo "::error::version PR for v${VERSION} could not be created (state: $STATE)"
                exit 1
              }
            fi
          fi
          # Batch mode (#102): do not arm auto-merge on the version PR.
          # It stays open as the manual batch-decision point — a human
          # decides when the batch (nine-issue fixes plus GitLab
          # evidence) ships as a deliberate rc cut.
          # Re-arm condition (#107, user ruling 2026-08-20): auto-merge
          # stays armed off through the 1.0.0 line — every version PR is
          # the manual batch-decision point; the re-arm decision is
          # re-evaluated after 1.0.0 ships.

      - name: Verify version PR workflows started (not awaiting approval)
        if: steps.pending.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
        run: |
          # #71: no required workflow may end up needing undisclosed manual
          # approval. Poll the version PR head's check-runs: action_required
          # there means the runs were created but wait for approval (zero
          # jobs) — the exact PR #61 failure mode. Fail loudly with the fix.
          for i in $(seq 1 12); do
            sleep 10
            SHA=$(git rev-parse changeset-release/main)
            JSON=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100" 2>/dev/null || echo '{"check_runs":[]}')
            STATE=$(printf '%s' "$JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);const runs=j.check_runs||[];if(runs.length===0){console.log('empty');return;}if(runs.some(r=>r.conclusion==='action_required')){console.log('action_required');return;}console.log('started')}catch{console.log('empty')}})")
            echo "check-runs poll ${i}/12: ${STATE}"
            case "$STATE" in
              started) exit 0 ;;
              action_required)
                echo "::error::Required workflows on the version PR are action_required (zero jobs): the head was pushed by an actor whose events need approval (the bare github.token / github-actions[bot]). Provide RELEASE_BOT_TOKEN (a PAT or GitHub App token with contents + pull-requests write) and re-run, or approve the runs manually."
                exit 1 ;;
            esac
          done
          echo "::error::Version PR check-runs did not appear within 120s; investigate the PR checks manually."
          exit 1

      # Push without pending changesets whose head is a version bump: publish.
      - name: Build
        if: "steps.pending.outputs.count == '0' && startsWith(github.event.head_commit.message, 'chore(release): v')"
        run: pnpm run build

      - name: Publish to npm
        if: "steps.pending.outputs.count == '0' && startsWith(github.event.head_commit.message, 'chore(release): v')"
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "specgit@${VERSION}" version >/dev/null 2>&1; then
            echo "specgit@${VERSION} is already on npm; skipping publish."
            exit 0
          fi
          pnpm run check:pack-version
          # Dist tag: while in prerelease mode (.changeset/pre.json) publish
          # under its tag (rc) so `latest` stays on the stable line — the
          # same rule `changeset publish` applies. Outside pre mode: latest.
          DIST_TAG=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('.changeset/pre.json','utf8')).tag||'latest')}catch{console.log('latest')}")
          # npm authentication via OIDC trusted publishing (id-token: write
          # + registry-url): no environment binding, no token. Provenance is
          # explicit so the attestation cannot be silently dropped.
          npm publish --access public --provenance --tag "$DIST_TAG"

      - name: Tag and create GitHub Release
        if: "steps.pending.outputs.count == '0' && startsWith(github.event.head_commit.message, 'chore(release): v')"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin; skipping tag push."
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; skipping."
            exit 0
          fi
          # Prerelease versions (any -suffix) must not displace the stable
          # "Latest" rollup on the releases page.
          PRERELEASE=""
          if [ "${VERSION#*-}" != "$VERSION" ]; then PRERELEASE="--prerelease"; fi
          gh release create "${TAG}" --generate-notes --title "${TAG}" ${PRERELEASE} \
            --notes "Automated release from merged changesets. npm: https://www.npmjs.com/package/specgit/v/${VERSION}"
