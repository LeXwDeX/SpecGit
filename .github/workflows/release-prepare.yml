# Explicit coordinator dispatch. This read-only workflow builds and qualifies three platforms; final publication uses the coordinator native npm/gh session.
name: Release
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Exact stable Cargo/workspace/package version
        type: string
        default: 2.0.0
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build native release (${{ matrix.label }})
    if: github.repository == 'LeXwDeX/SpecGit'
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.label == 'windows' && 60 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os:
              - self-hosted
              - Linux
              - X64
            label: linux
            target: x86_64-unknown-linux-gnu
          - os:
              - self-hosted
              - macOS
              - ARM64
            label: macos
            target: aarch64-apple-darwin
          - os:
              - self-hosted
              - Windows
              - X64
            label: windows
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
        working-directory: runtime
    steps:
      - name: Locate the existing Git Bash installation
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: .
        run: |-
          $git = Get-Command git -ErrorAction Stop
          $gitBash = Join-Path (Split-Path (Split-Path $git.Source)) "bin"
          if (-not (Test-Path (Join-Path $gitBash "bash.exe"))) { throw "Install Git Bash and the MSVC C++ workload before retrying." }
          $gitBash | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20.19.0
          package-manager-cache: false
      - name: Check exact stable version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: node distribution/release-version.mjs --version "$RELEASE_VERSION"
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt
      - name: Rust formatting and lint
        timeout-minutes: ${{ matrix.label == 'windows' && 60 || 15 }}
        run: node scripts/native-resume.mjs --phase lint --target '${{ matrix.target }}'
      - name: Compile native test executables
        timeout-minutes: ${{ matrix.label == 'windows' && 60 || 15 }}
        run: node scripts/native-resume.mjs --phase compile-tests --target '${{ matrix.target }}'
      - name: Rust public interface and real subprocess regressions
        timeout-minutes: ${{ matrix.label == 'windows' && 60 || 15 }}
        run: node scripts/native-resume.mjs --phase source-tests --target '${{ matrix.target }}'
      - name: Native distribution regressions
        timeout-minutes: ${{ matrix.label == 'windows' && 60 || 15 }}
        run: node scripts/native-resume.mjs --phase distribution-tests --target '${{ matrix.target }}'
      - name: Compile remapped release executable
        timeout-minutes: ${{ matrix.label == 'windows' && 60 || 15 }}
        run: node scripts/native-resume.mjs --phase compile-release --target '${{ matrix.target }}'
      - name: Install packages with scripts disabled
        timeout-minutes: ${{ matrix.label == 'windows' && 60 || 15 }}
        run: node scripts/native-resume.mjs --phase install --target '${{ matrix.target }}'
      - name: Repeat public journeys through the installed npm entrypoint
        timeout-minutes: ${{ matrix.label == 'windows' && 60 || 15 }}
        run: node scripts/native-resume.mjs --phase profile --target '${{ matrix.target }}'
      - name: Retain installed artifacts and complete test accounting
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-platform-${{ matrix.target }}
          path: |
            ${{ env.SPECGIT_NATIVE_INSTALLED }}/*.tgz
            ${{ env.SPECGIT_NATIVE_INSTALLED }}/installed.json
            ${{ env.SPECGIT_NATIVE_INSTALLED }}/profile.json
          retention-days: 14
          if-no-files-found: error
  assemble:
    needs: build
    runs-on:
      - self-hosted
      - Linux
      - X64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20.19.0
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-platform-*
          path: ${{ runner.temp }}/specgit-release-input-${{ github.run_id }}-${{ github.run_attempt }}
          digest-mismatch: error
      - name: Verify three platforms and generate checksums
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: node runtime/distribution/release-artifacts.mjs --input "$RUNNER_TEMP/specgit-release-input-${{ github.run_id }}-${{ github.run_attempt }}" --output "$RUNNER_TEMP/specgit-release-bundle-${{ github.run_id }}-${{ github.run_attempt }}" --version "$RELEASE_VERSION" --source "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: specgit-release-${{ github.sha }}
          path: ${{ runner.temp }}/specgit-release-bundle-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14
