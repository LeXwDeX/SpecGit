name: Release

# Release on merge to main: when pending changesets exist, consume them,
# publish to npm, tag, and create the GitHub Release. Direct pushes to main
# are already blocked by the specgit pre-push guard, so every release traces
# to a merged pull request.
on:
  push:
    branches: [main]

permissions:
  contents: write # tag push + GitHub Release
  id-token: write # npm OIDC trusted publishing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'LeXwDeX/SpecGit'
    runs-on: ubuntu-latest
    # Matches the npm trusted publisher configuration (repository +
    # workflow file + environment). The NPM environment also carries the
    # KEY automation-token secret as a fallback credential.
    environment: NPM
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24' # Node 24 ships npm 11.5.1+ required for OIDC trusted publishing
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Consume changesets
        id: version
        env:
          # @changesets/changelog-github needs a token to link PRs in the
          # generated changelog entries.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          BEFORE=$(node -p "require('./package.json').version")
          pnpm exec changeset version
          AFTER=$(node -p "require('./package.json').version")
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "after=$AFTER" >> "$GITHUB_OUTPUT"
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "No pending changesets — nothing to release."
          fi

      - name: Build
        if: steps.version.outputs.before != steps.version.outputs.after
        run: pnpm run build

      - name: Publish to npm
        if: steps.version.outputs.before != steps.version.outputs.after
        env:
          VERSION: ${{ steps.version.outputs.after }}
        run: |
          if npm view "specgit@${VERSION}" version >/dev/null 2>&1; then
            echo "specgit@${VERSION} is already on npm; skipping publish."
            exit 0
          fi
          pnpm run check:pack-version
          # npm authentication via OIDC trusted publishing (id-token: write
          # + registry-url). NODE_AUTH_TOKEN from the environment secret is
          # unnecessary when the trusted publisher matches.
          npm publish --access public --provenance

      - name: Commit version bump and push tag
        if: steps.version.outputs.before != steps.version.outputs.after
        env:
          VERSION: ${{ steps.version.outputs.after }}
        run: |
          git config user.name "specgit-release-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): v${VERSION}"
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin; skipping tag push."
          else
            git tag "${TAG}"
          fi
          git push origin HEAD:main "${TAG}" --follow-tags

      - name: Create GitHub Release
        if: steps.version.outputs.before != steps.version.outputs.after
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.after }}
        run: |
          TAG="v${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; skipping."
            exit 0
          fi
          gh release create "${TAG}" --generate-notes --title "${TAG}" \
            --notes "Automated release from merged changesets. npm: https://www.npmjs.com/package/specgit/v/${VERSION}"
