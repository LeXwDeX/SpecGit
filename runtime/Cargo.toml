[package]
name = "specgit-runtime"
version = "2.0.0-dev.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"
description = "SpecGit native delivery harness"

[lib]
name = "specgit"

[[bin]]
name = "specgit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["process", "io-util", "io-std", "time", "rt-multi-thread", "macros", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
sha2 = "0.10"
url = "2"
tempfile = "3"
serde_yaml_ng = "0.10"
regex = "1"
base64 = "0.22.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console"] }


[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[features]
test-fixtures = []

[[bin]]
name = "specgit-process-fixture"
path = "tests/fixtures/process-child.rs"
required-features = ["test-fixtures"]
